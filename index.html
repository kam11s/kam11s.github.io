const DATA = {"CHAPTERS":[{"n":1,"name":"Just Like Paradise","place":"Key Lento","lead":"Mostly Jason","lock":"Tourist Trap","lockNote":"Saying yes when Lucia asks if you are ready for Mattia's job starts Tourist Trap. That runs the last jobs of the chapter and closes the Key Lento safehouse. Manual save first. There is no mission replay."},{"n":2,"name":"Paradise Lost","place":"Port Gellhorn, Starlet Motel","lead":"Mostly Lucia","lock":"Checking Out","lockNote":"Checking Out ends the motel stay. Grab the two cards and two reads inside before you start it. Early guides say the marker wants the other Chapter 2 story jobs done, and some report a cash gate near $15,000 — read your own marker, that dollar figure is not universal yet."},{"n":3,"name":"Tits, Ass, Drug Money","place":"Vice City, Bayside","lead":"Both","lock":"End of the chapter","lockNote":"Hourglass pins expire. Race Against Yago and the Halifax follow-ups (Dubious Provenance parts 2 and 3) are the ones players are actually losing. Read the two Bayside issues before you move out."},{"n":4,"name":"Vice City, Baby","place":"Ocean Beach","lead":"Both","lock":"Power Play","lockNote":"Bad Driver! (find Felipe) is reported gone once Power Play starts. This Is a Free Call From… is an hourglass stranger job for Lucia. Keep a manual save — still no replay."},{"n":5,"name":"Top of the World, Ma","place":"The endgame","lead":"Both","lock":"The End of the Road","lockNote":"Nothing new is confirmed missable here. There is no mission replay, so keep a manual save before the finale if you care about seeing the other bond ending later."}],"CLIPS":[{"id":"ch1-mistakes","youtubeId":"FvbVccBoVds","title":"Don't make these Chapter 1 mistakes","channel":"Holy13","minutes":"9:02","shows":"Spoiler-light Chapter 1: manual saves, cash you lose on death, and pins the game never explains","tags":["cash","story"]},{"id":"before-leave","youtubeId":"uObAnlU0MgI","title":"Don't finish Chapter 1 until you do this","channel":"SubscribeFo n":"Chapter 1 story","reward":"Story cash and the next Brian thread.","tier":"solid","tags":["cash","story"],"detail":"Required story. Payout is mission cash plus whatever you pick up on the way. Manual-save if a choice or a trunk loot is coming — finished jobs cannot be replayed."},{"id":"m-1-6","title":"Unwanted Attention","chapter":1,"kind":"mission","when":"Chapter 1 story","reward":"Cal's follow-up. Story progress.","tier":"solid","tags":["story"],"detail":"Required story. Payout is mission cash plus whatever you pick up on the way. Manual-save if a choice or a trunk loot is coming — finished jobs cannot be replayed."},{"id":"m-1-7","title":"Pipework","chapter":1,"kind":"mission","when":"Chapter 1 story","reward":"Macizo cigars, if you pick up the box Mandy throws.","tier":"high","tags":["weapon","story"],"detail":"After you fix the sink, Mandy storms out and throws a box of Macizo cigars. They are only on the ground during this mission."},{"id":"m-1-8","title":"Hey Arnold!","chapter":1,"kind":"mission","when":"Chapter 1 story","reward":"Criminal-profile note only. Arnold is gone either way.","tier":"flavor","tags":["story"],"detail":"Kill him on the dock or let him swim. Same story. The profile records which you did."},{"id":"m-1-9","title":"Island Dreams","chapter":1,"kind":"mission","when":"Chapter 1 story","reward":"Dobbs lives or the shark eats him. Cutscene only.","tier":"flavor","tags":["story"],"detail":"Shoot the shark twice and Dobbs makes it. Leave it and he doesn't. No penalty either way."},{"id":"m-1-10","title":"Feng Shui","chapter":1,"kind":"mission","when":"Chapter 1 story","reward":"Unlocks Lucia's homecoming errands: clothes, necklace, house repairs.","tier":"high","tags":["bond","story"],"detail":"This is the window. Andy's clothes, the Tomás necklace, and the stair / roof / railing / wall repairs all raise the bond that carries forward. They close when you pick her up in Coming Home."},{"id":"m-1-11","title":"Coming Home","chapter":1,"kind":"mission","when":"Chapter 1 story","reward":"Bond from the Rusty Anchor night, if you actually show up for her.","tier":"critical","tags":["bond","story"],"detail":"Before you drive to get her: clothes from Andy, $475 Tomás necklace at The Siren's Chest, groceries, haircut, flowers, and the house repairs. At the Anchor, check in with L2 / LT, dance, and buy what she asks. Ignoring the bar order drops the bond."},{"id":"m-1-12","title":"Buck Me","chapter":1,"kind":"mission","when":"Chapter 1 story","reward":"Banking. Family Savings is the only balance that survives Chapter 1.","tier":"critical","tags":["cash"],"detail":"Move up to $5,000 into Family Savings before Tourist Trap. Wallet cash, the floorboard stash, and BuckMe checking are wiped. Weapons, clothes, and tattoos carry. A separate Rainy Day Fund (~$5,000) can still be collected later.","watch":[{"id":"ch1-bank","shows":"The $0 Chapter 1 balance. Buck Me opens Family Savings — fill the $5,000 before the lock."}]},{"id":"m-1-13","title":"Clean Up After Donnie","chapter":1,"kind":"mission","when":"Chapter 1 story","reward":"Four packages, about $900 each if you fence them.","tier":"high","tags":["cash"],"detail":"Optional-feeling story step. Sell before Donnie stops buying — that happens once Swamped is done."},{"id":"m-1-14","title":"Down to Earth","chapter":1,"kind":"mission","when":"Chapter 1 story","reward":"Next morning Lucia may offer the balcony meditation.","tier":"critical","tags":["trophy","story"],"detail":"Sleep, talk to her in the kitchen, follow her out, choose Accept. See the meditation entry. Do not shrug this off."},{"id":"m-1-15","title":"Clear Skies","chapter":1,"kind":"mission","when":"Chapter 1 story","reward":"Story progress through the Keys.","tier":"solid","tags":["story"],"detail":"Required story. Payout is mission cash plus whatever you pick up on the way. Manual-save if a choice or a trunk loot is coming — finished jobs cannot be replayed."},{"id":"m-1-16","title":"Building a Life","chapter":1,"kind":"mission","when":"Chapter 1 story","reward":"Domestic beat. Some lists fold this into the jobs around it.","tier":"solid","tags":["bond","story"],"detail":"If the pin is on your map, do it. Eurogamer counts it; a few 91-mission lists skip the name. It will not be replayable later."},{"id":"m-1-17","title":"Day Release","chapter":1,"kind":"mission","when":"Chapter 1 story","reward":"Bond if Lucia rides the jet ski with Jason. Clock Out shirt if you collect her before 4pm.","tier":"high","tags":["bond","look"],"detail":"Jet ski together for the bump. Win or lose the race, the mission continues. One checklist also lists Clock Out — pick her up from the community center before 4pm — for a shirt. Confirm the clock on your save."},{"id":"m-1-18","title":"Swamped","chapter":1,"kind":"mission","when":"Chapter 1 story","reward":"Bond if you tell her Brian is retiring. Sell to Donnie BEFORE you start.","tier":"critical","tags":["bond","cash"],"detail":"Donnie stops being a buyer after this. The timed choice at the end is the first real relationship test. Honesty is the reward. Silence comes back in Recalibration as a lecture and a drop."},{"id":"m-1-19","title":"Don Gone","chapter":1,"kind":"mission","when":"Chapter 1 story","reward":"Donnie's H&L .38, a unique revolver, plus aviators in the trailer.","tier":"critical","tags":["weapon","look"],"detail":"Open the trunk of Donnie's car before the game tells you to destroy it. PowerPyx marks the revolver missable. Fight the Aviators or run — no lasting difference."},{"id":"m-1-20","title":"Recalibration","chapter":1,"kind":"mission","when":"Chapter 1 story","reward":"Fishing with Cal. The bill comes due if you hid Brian's retirement.","tier":"high","tags":["bond","story"],"detail":"Buy the 6-pack. Grill the fish, flip before they burn. If you stayed quiet in Swamped, Cal lets it slip and the bond drops.","watch":[{"id":"ch1-bank","shows":"What unprotected Chapter 1 cash looks like. Run the checklist, then start Tourist Trap."},{"id":"before-leave","shows":"The full don't-finish-Chapter-1 list, from the start of the video."},{"id":"ch1-mistakes","shows":"Spoiler-light mistakes: manual saves, cash you drop when you die, pins the game never explains."}]},{"id":"m-1-21","title":"Tourist Trap","chapter":1,"kind":"mission","when":"Chapter 1 story","reward":"Chapter finale. You lose the house, the car, and unprotected cash.","tier":"critical","tags":["story","cash"],"detail":"POINT OF NO RETURN. Last three missions of the chapter lock in. Family Savings (cap $5,000) is what you keep. Do the checklist on the Rewards tab first, then manual-save a second slot."},{"id":"m-1-22","title":"Home Sweet Home","chapter":1,"kind":"mission","when":"Chapter 1 story","reward":"Andy's jacket if you reach his car unseen.","tier":"high","tags":["look"],"detail":"During the mission, get to Andy's car without being spotted for the jacket. Easy to miss while the set piece is moving."},{"id":"m-1-23","title":"Discharge Time","chapter":1,"kind":"mission","when":"Chapter 1 story","reward":"Chapter 1 complete. You are out of the Keys.","tier":"solid","tags":["story"],"detail":"After this, Key Lento's safehouse is gone. Anything still inside the house is gone with it."},{"id":"x-meditation","title":"Balcony meditation with Lucia","chapter":1,"kind":"pickup","when":"Morning after Down to Earth, before Tourist Trap","reward":"One meditation toward Positive Mental Attitude. 100% only needs 15 of 18, so this is a trophy question, not a percent question.","tier":"critical","tags":["trophy"],"disputed":"PowerPyx and some outlets say the trophy wants this one. A November 21 report says the trophy popped without it. Do it anyway — you cannot come back.","detail":"Talk to Lucia in the kitchen when she says she is going to meditate. Follow her to the balcony. Choose Accept. Decline and that spot is gone. It is not a marked meditation pin like the other 18.","watch":[{"id":"meditation","shows":"The missable-trophy card. Hit play and you see Lucia's balcony prompt — choose Accept."},{"id":"before-leave","shows":"The Chapter 1 checkout, meditation included, before the house is gone."}]},{"id":"x-savings","title":"Park $5,000 in Family Savings","chapter":1,"kind":"pickup","when":"After Buck Me, before Tourist Trap","reward":"Up to $5,000 kept into Chapter 2. Everything else in cash, checking, and the floor stash is deleted.","tier":"critical","tags":["cash"],"detail":"Family Savings cap is $5,000 in Chapter 1. Fill it, then spend the rest on guns and kit you keep. Weapons, clothes, and tattoos carry. The car and its upgrades do not. A separate Rainy Day Fund can still be grabbed later.","watch":[{"id":"ch1-bank","shows":"The $0 Chapter 1 bank screen. This is the cash you are trying not to become."},{"id":"before-leave","shows":"The checkout list that includes filling Family Savings before you leave."}]},{"id":"x-shirley-rum","title":"Get Shirley's Rum","chapter":1,"kind":"side","when":"Exploration pin near Jason's house, before Tourist Trap","reward":"The errand itself and Shirley's payout. Not a trophy, not 100%, not Strangers & Freaks. It simply disappears.","tier":"high","tags":["cash","story"],"detail":"Do rum before the scooter. The bottle is at Three Sheets Liquor. If Shirley never offers the second job, sleep at the safehouse and walk past her place again.","clipIds":["before-leave"]},{"id":"x-shirley-scooter","title":"Steal the Scooter for Shirley","chapter":1,"kind":"side","when":"After the rum, before Tourist Trap","reward":"Second Shirley payout. Same rule: no trophy, no percent, gone when the chapter locks.","tier":"high","tags":["cash","story"],"detail":"She may not offer it the same day as the rum. Skip time by sleeping, then pass her house.","clipIds":["before-leave"]},{"id":"x-books-1","title":"Five reads in Jason's house","chapter":1,"kind":"pickup","when":"Any time you can still enter the house","reward":"Lore plus hunting and fishing tips. Same titles exist elsewhere later, so 100% can still be finished — reading them here saves the scavenger hunt.","tier":"high","tags":["collectible","percent"],"detail":"Ashes of Glory on the bedside table. Lethal By Design on a living-room table. Orca: A Whole Different Animal by the east window. Off the Hook in the shed under the house. Body Copy on the back deck by the weights. The game does not mark what you have already read.","clipIds":["before-leave"]},{"id":"x-repairs","title":"House repairs before Coming Home","chapter":1,"kind":"hangout","when":"After Feng Shui, before you pick Lucia up","reward":"Bond. Players who clear the homecoming list start the relationship near 3 of 4 hearts.","tier":"critical","tags":["bond"],"detail":"Stairs, roof, railing, wall, plus Andy's clothes, a haircut, flowers, groceries, and the $475 Tomás necklace at The Siren's Chest. The repair prompts vanish once Coming Home starts.","clipIds":["before-leave"]},{"id":"x-lost-drugs","title":"Find the Lost Drugs","chapter":1,"kind":"side","when":"Chapter 1, before Donnie stops buying","reward":"About $900 a package across four spots, fenced. A separate sunken-boat dive is also reported.","tier":"high","tags":["cash"],"detail":"Do this while Donnie still buys. After Swamped he is done. Don't sink the payout into checking — park profit in Family Savings or into guns."},{"id":"x-donnie-gun","title":"Donnie's H&L .38","chapter":1,"kind":"pickup","when":"During Don Gone, before the car is destroyed","reward":"Unique revolver. Free, permanent, kept by both characters. Aviators are in the trailer on the same job.","tier":"critical","tags":["weapon","look"],"detail":"Trunk first, explosion second. This is the cleanest missable gun in the chapter. Open the trunk of Donnie's car during Don Gone and take the Hawk & Little .38 before you burn or sink it. No short yet shows the trunk itself, so this row stays text — don't trust a gold-rifle thumbnail as this revolver."},{"id":"x-cigars","title":"Macizo cigars","chapter":1,"kind":"pickup","when":"Pipework, the moment Mandy throws them","reward":"A box of Macizo cigars. Mission-only pickup.","tier":"high","tags":["look"],"detail":"They are on the roadside after the sink cutscene. Leave the yard and they are gone."},{"id":"x-yacht-shades","title":"Lucia's yacht sunglasses","chapter":1,"kind":"pickup","when":"Day Release, middle deck","reward":"Sunglasses for Lucia from the couple on the middle deck.","tier":"solid","tags":["look"],"detail":"Talk to the couple before you leave the yacht. Easy to walk past."},{"id":"x-anchor-shirt","title":"Rusty Anchor shirt and cap","chapter":1,"kind":"pickup","when":"Before Swamped — the Ring the Bell! interaction","reward":"Rusty Anchor shirt and cap.","tier":"solid","tags":["look"],"detail":"Reported on Chapter 1 clothing checklists. If the interaction is at the bar, do it before the chapter's back half."},{"id":"m-2-1","title":"What's in the Bag?","chapter":2,"kind":"mission","when":"Chapter 2 story","reward":"Opens the Port Gellhorn stretch while Jason is laid up.","tier":"solid","tags":["story"],"detail":"Required story. Payout is mission cash plus whatever you pick up on the way. Manual-save if a choice or a trunk loot is coming — finished jobs cannot be replayed."},{"id":"m-2-2","title":"Ambulance Chaser","chapter":2,"kind":"mission","when":"Chapter 2 story","reward":"Story cash. Lucia carrying the chapter.","tier":"solid","tags":["cash","story"],"detail":"Required story. Payout is mission cash plus whatever you pick up on the way. Manual-save if a choice or a trunk loot is coming — finished jobs cannot be replayed."},{"id":"m-2-3","title":"Just Moved In","chapter":2,"kind":"mission","when":"Chapter 2 story","reward":"Starlet Motel becomes home. The room has reads and two cards.","tier":"high","tags":["collectible","story"],"detail":"The motel is temporary. Loot it before Checking Out, not after."},{"id":"m-2-4","title":"Girls' Trip","chapter":2,"kind":"mission","when":"Chapter 2 story","rewa const done = JSON.parse(localStorage.getItem("vicewire-public") || "{}");
let chapter = 1;
let tab = "path";
const tabs = [["path","Story"],["choices","Choices"],["field","100%"],["people","Strangers"],["clips","Clips"]];
function save(id){ done[id]=!done[id]; localStorage.setItem("vicewire-public", JSON.stringify(done)); render(); }
function esc(s){ return String(s??"").replace(/[&<>]/g, c => ({'&':'&','<':'<','>':'>'}[c])); }
function clip(id){ return DATA.CLIPS.find(c => c.id===id); }
function watchOf(e){
  const w = (e.watch && e.watch[0]) || null;
  const id = w?.id || (e.clipIds && e.clipIds[0]);
  const c = id && clip(id);
  if (!c) return "";
  const start = w?.start || 0;
  const shows = w?.shows || c.shows;
  return '<a href="https://www.youtube.com/watch?v='+c.youtubeId+(start?'&t='+start+'s':'')+'" target="_blank" rel="noopener"><img class="thumb" alt="" src="https://i.ytimg.com/vi/'+c.youtubeId+'/hqdefault.jpg"/><span class="reward">'+esc(shows)+'</span></a>';
}
function render(){
  document.getElementById("chapters").innerHTML = DATA.CHAPTERS.map(ch =>
    '<button class="'+(ch.n===chapter?'on':'')+'" data-ch="'+ch.n+'">'+ch.n+' '+esc(ch.name)+'</button>').join("");
  document.getElementById("tabs").innerHTML = tabs.map(([id,label]) =>
    '<button class="'+(id===tab?'on':'')+'" data-tab="'+id+'">'+label+'</button>').join("");
  const root = document.getElementById("list");
  const info = DATA.CHAPTERS[chapter-1];
  let html = '<div class="card"><div class="tier">Stop before '+esc(info.lock)+'</div><p>'+esc(info.lockNote)+'</p><p class="muted">'+esc(info.place)+' · '+esc(info.lead)+'</p></div>';
  if (tab==="path") {
    html += DATA.ENTRIES.filter(e => e.chapter===chapter).map(e =>
      '<article class="card"><label class="row"><input type="checkbox" data-id="'+e.id+'" '+(done[e.id]?'checked':'')+'/><span><span class="tier '+e.tier+'">'+e.tier+'</span><h2>'+esc(e.title)+'</h2><p class="reward">'+esc(e.reward)+'</p><p>'+esc(e.detail)+'</p>'+watchOf(e)+'</span></label></article>').join("");
  } else if (tab==="choices") {
    html += DATA.CHOICES.filter(c => c.chapter===chapter).map(c =>
      '<article class="card"><h2>'+esc(c.mission)+'</h2><p>'+esc(c.prompt)+'</p>'+
      c.options.map(o => '<p><span class="tier '+(o.recommended?'critical':o.tier)+'">'+(o.recommended?'Pick this · ':'')+o.tier+'</span> '+esc(o.label)+'<br/><span class="reward">'+esc(o.reward)+'</span></p>').join("")+
      (c.note?'<p class="muted">'+esc(c.note)+'</p>':'')+'</article>').join("") || '<p class="muted">No dialogue checks in this chapter.</p>';
  } else if (tab==="field") {
    html += DATA.PERCENT.map(g => '<article class="card"><h2>'+esc(g.group)+'</h2>'+g.items.map(i => '<p>'+esc(i.name)+' <span class="muted">'+i.max+'</span></p>').join("")+'</article>').join("");
  } else if (tab==="people") {
    html += DATA.STRANGERS.filter(s => !chapter || String(s.chapter).includes(String(chapter)) || s.chapter==="any").map(s =>
      '<article class="card"><h2>'+esc(s.name)+'</h2><p class="reward">'+esc(s.tag)+(s.missable?' · missable':'')+'</p><p>'+esc(s.who)+'</p><p>'+s.quests.map(esc).join("<br/>")+'</p><p class="muted">'+esc(s.note)+'</p></article>').join("");
  } else {
    html += DATA.CLIPS.map(c => '<article class="card"><h2>'+esc(c.title)+'</h2><p class="muted">'+esc(c.channel)+' · '+esc(c.minutes)+'</p>'+watchOf({clipIds:[c.id]})+'</article>').join("");
  }
  root.innerHTML = html;
}
